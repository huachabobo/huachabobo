<svg width="1200" height="450" viewBox="0 0 1200 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CodeLife Lab field notes</title>
  <desc id="desc">An editorial field-note card for CodeLife Lab's non-LLM digital life and current state-nine compact feedback audit.</desc>
  <defs>
    <linearGradient id="field" x1="18" y1="12" x2="1180" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF8EF"/>
      <stop offset="0.62" stop-color="#E1F0E7"/>
      <stop offset="1" stop-color="#F7DBE2"/>
    </linearGradient>
    <pattern id="paperGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#315B4E" stroke-opacity="0.055"/>
    </pattern>
    <style>
      .display { font: 700 52px Georgia, "Times New Roman", serif; fill: #213C34; letter-spacing: -0.035em; }
      .sans { font-family: "Avenir Next", "Trebuchet MS", sans-serif; fill: #213C34; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; fill: #213C34; }
      .label { font-size: 13px; font-weight: 800; letter-spacing: 0.13em; }
      .body { font-size: 19px; font-weight: 600; }
      .small { font-size: 14px; font-weight: 700; }
      .tiny { font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect x="8" y="8" width="1184" height="434" rx="34" fill="url(#field)"/>
  <rect x="8.75" y="8.75" width="1182.5" height="432.5" rx="33.25" stroke="#213C34" stroke-width="1.5"/>
  <rect x="24" y="24" width="1152" height="402" rx="25" fill="url(#paperGrid)"/>

  <g class="sans">
    <rect x="54" y="48" width="164" height="34" rx="17" fill="#92C9A8"/>
    <text x="136" y="70" class="label" text-anchor="middle">02 / RESEARCH</text>
    <text x="54" y="145" class="display">CodeLife Lab</text>
    <text x="56" y="180" class="body">non-LLM organisms · LifeVM · executable CIL genomes</text>
    <text x="56" y="221" class="small" opacity="0.68">The world may use LLMs. The organisms do not.</text>
  </g>

  <g transform="translate(54 260)" class="sans">
    <rect width="500" height="132" rx="22" fill="#213C34"/>
    <text x="26" y="34" class="label" fill="#FFF9F0">STATE NINE / LATEST FIELD AUDIT</text>
    <text x="26" y="68" class="body" fill="#FFF9F0">compact feedback audit</text>
    <circle cx="30" cy="98" r="6" fill="#F2C760"/>
    <text x="46" y="103" class="small" fill="#FFF9F0">release gate: not passed</text>
    <circle cx="258" cy="98" r="6" fill="#FF8DA1"/>
    <text x="274" y="103" class="small" fill="#FFF9F0">next: failed-fork backoff</text>
  </g>

  <g>
    <rect x="606" y="48" width="536" height="344" rx="26" fill="#FFF9F0" fill-opacity="0.76"/>
    <text x="636" y="82" class="sans label">PUBLIC LIFE LOOP</text>

    <path d="M666 205C723 131 795 131 850 205C905 279 977 279 1082 205" stroke="#213C34" stroke-opacity="0.18" stroke-width="28" stroke-linecap="round"/>
    <path d="M666 205C723 131 795 131 850 205C905 279 977 279 1082 205" stroke="#213C34" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 13">
      <animate attributeName="stroke-dashoffset" values="0;-84" dur="4.5s" repeatCount="indefinite"/>
    </path>

    <g class="sans">
      <circle cx="666" cy="205" r="28" fill="#FF8DA1"/>
      <text x="666" y="210" class="label" text-anchor="middle">G</text>
      <text x="666" y="253" class="tiny" text-anchor="middle">GENOME</text>

      <circle cx="782" cy="156" r="28" fill="#F2C760"/>
      <text x="782" y="161" class="label" text-anchor="middle">VM</text>
      <text x="782" y="116" class="tiny" text-anchor="middle">EXECUTE</text>

      <circle cx="900" cy="254" r="28" fill="#92C9A8"/>
      <text x="900" y="259" class="label" text-anchor="middle">E</text>
      <text x="900" y="302" class="tiny" text-anchor="middle">ENERGY</text>

      <circle cx="1004" cy="248" r="28" fill="#FFB0BE"/>
      <text x="1004" y="253" class="label" text-anchor="middle">R</text>
      <text x="1004" y="296" class="tiny" text-anchor="middle">REPRODUCE</text>

      <circle cx="1082" cy="205" r="28" fill="#213C34">
        <animate attributeName="r" values="26;31;26" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="1082" y="210" class="label" fill="#FFF9F0" text-anchor="middle">L</text>
      <text x="1082" y="253" class="tiny" text-anchor="middle">LINEAGE</text>
    </g>

    <rect x="636" y="330" width="476" height="38" rx="12" fill="#213C34" fill-opacity="0.08"/>
    <text x="654" y="354" class="mono small">observe → compare → falsify → iterate</text>
    <rect x="1030" y="341" width="8" height="17" rx="2" fill="#FF8DA1">
      <animate attributeName="opacity" values="1;0.18;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
